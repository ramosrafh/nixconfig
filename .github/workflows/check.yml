name: Check flake

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build
